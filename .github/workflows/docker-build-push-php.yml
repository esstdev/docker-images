name: esst/php

# Manual only. Building and publishing to Docker Hub is a deliberate act: neither
# a merge to main nor a GitHub release triggers a build, so the tags production
# consumes can never be overwritten as a side effect of landing code. Run this
# from Actions -> "esst/php" -> "Run workflow".
on:
  workflow_dispatch:
    inputs:
      build_suffix:
        description: >-
          Immutable build suffix, e.g. "b2". When set, the run publishes ONLY the
          suffixed tags (8.5.7-fpm-nginx-alpine-b2) and leaves the mobile tags
          (8.5.7-fpm-nginx-alpine) untouched, so nothing in production inherits
          the new image until it is promoted. Leave empty to publish the mobile
          tags as usual.
        required: false
        type: string

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      suffix: ${{ steps.set_suffix.outputs.suffix }}
      publish_mobile: ${{ steps.set_suffix.outputs.publish_mobile }}
    steps:
      - name: Resolve build suffix
        id: set_suffix
        shell: bash
        run: |
          raw='${{ inputs.build_suffix }}'
          # strip whitespace and a leading dash, so both "b2" and "-b2" work
          clean="$(echo "$raw" | tr -d '[:space:]' | sed 's/^-//')"
          if [[ -n "$clean" ]]; then
            if [[ ! "$clean" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "Invalid build_suffix: '$raw'" >&2
              exit 1
            fi
            echo "suffix=-$clean" >> $GITHUB_OUTPUT
            echo "publish_mobile=false" >> $GITHUB_OUTPUT
            echo "Publishing SUFFIXED tags only: *-$clean (mobile tags untouched)"
          else
            echo "suffix=" >> $GITHUB_OUTPUT
            echo "publish_mobile=true" >> $GITHUB_OUTPUT
            echo "Publishing mobile tags (no suffix)"
          fi


  # ============================================================================================
  # BUILD & PUSH AMD64 - FPM ALPINE
  # ============================================================================================
  build-test-and-push-amd64-fpm:
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      matrix:
        php_version: [ 8.5.7 ]
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Build AMD64 FPM-Alpine (not pushed yet)
        id: docker_build_fpm
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64
          push: false
          load: true
          file: ./php/${{ matrix.php_version }}/fpm-alpine/Dockerfile
          tags: esst/php:${{ matrix.php_version }}-fpm-alpine-test

      - name: Run container for testing
        run: docker run -d --name fpm_alpine_test_${{ matrix.php_version }} esst/php:${{ matrix.php_version }}-fpm-alpine-test

      - name: Check PHP extensions
        run: |
          extensions=("bcmath" "exif" "gd" "intl" "ldap" "pcntl" "pdo_mysql" "xml" "mbstring" "curl" "zip" "imagick" "redis")
          for ext in "${extensions[@]}"; do
            if ! docker exec fpm_alpine_test_${{ matrix.php_version }} php -m | grep -wq "$ext"; then
              echo "$ext extension is NOT installed"
              exit 1
            fi
          done
          echo "All required extensions are installed"

      - name: Push Tested AMD64 FPM-Alpine
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64
          push: true
          file: ./php/${{ matrix.php_version }}/fpm-alpine/Dockerfile
          tags: esst/php:${{ matrix.php_version }}-fpm-alpine${{ needs.prepare.outputs.suffix }}-amd64

  # ============================================================================================
  # BUILD & PUSH AMD64 - FPM + NGINX ALPINE
  # ============================================================================================
  build-test-and-push-amd64-nginx:
    runs-on: ubuntu-latest
    needs: [ prepare, build-test-and-push-amd64-fpm ]
    strategy:
      matrix:
        php_version: [ 8.5.7 ]
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Build AMD64 FPM-Nginx-Alpine
        id: docker_build_nginx
        uses: docker/build-push-action@v7
        with:
          build-args: |
            ARCH=amd64
            BASE_SUFFIX=${{ needs.prepare.outputs.suffix }}
          platforms: linux/amd64
          push: true
          file: ./php/${{ matrix.php_version }}/fpm-alpine/Dockerfile.nginx
          tags: esst/php:${{ matrix.php_version }}-fpm-nginx-alpine${{ needs.prepare.outputs.suffix }}-amd64

  # ============================================================================================
  # BUILD & PUSH ARM64 - FPM ALPINE
  # ============================================================================================
  build-and-push-arm64-fpm:
    runs-on: ubuntu-24.04-arm
    needs: [ prepare, build-test-and-push-amd64-fpm ]
    strategy:
      matrix:
        php_version: [ 8.5.7 ]
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Build & Push ARM64 FPM-Alpine
        uses: docker/build-push-action@v7
        with:
          platforms: linux/arm64
          push: true
          file: ./php/${{ matrix.php_version }}/fpm-alpine/Dockerfile
          tags: esst/php:${{ matrix.php_version }}-fpm-alpine${{ needs.prepare.outputs.suffix }}-arm64

  # ============================================================================================
  # BUILD & PUSH ARM64 - FPM + NGINX ALPINE
  # ============================================================================================
  build-and-push-arm64-nginx:
    runs-on: ubuntu-24.04-arm
    needs: [ prepare, build-and-push-arm64-fpm, build-test-and-push-amd64-nginx ]
    strategy:
      matrix:
        php_version: [ 8.5.7 ]
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Build & Push ARM64 FPM-Nginx-Alpine
        uses: docker/build-push-action@v7
        with:
          build-args: |
            ARCH=arm64
            BASE_SUFFIX=${{ needs.prepare.outputs.suffix }}
          platforms: linux/arm64
          push: true
          file: ./php/${{ matrix.php_version }}/fpm-alpine/Dockerfile.nginx
          tags: esst/php:${{ matrix.php_version }}-fpm-nginx-alpine${{ needs.prepare.outputs.suffix }}-arm64

  # ============================================================================================
  # FINALIZE: MERGE MULTI-ARCH
  # ============================================================================================
  finalize-multiarch:
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build-test-and-push-amd64-fpm
      - build-test-and-push-amd64-nginx
      - build-and-push-arm64-fpm
      - build-and-push-arm64-nginx
    strategy:
      matrix:
        php_version: [ 8.5.7 ]
        variant: [ fpm-alpine, fpm-nginx-alpine ]
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Merge Multi-Arch Images
        env:
          SUFFIX: ${{ needs.prepare.outputs.suffix }}
          PUBLISH_MOBILE: ${{ needs.prepare.outputs.publish_mobile }}
          VARIANT: ${{ matrix.php_version }}-${{ matrix.variant }}
        run: |
          set -euo pipefail

          # Always publish the exact tag this run built. With a suffix that is an
          # immutable tag (e.g. 8.5.7-fpm-nginx-alpine-b2); without one it is the
          # mobile tag itself, which keeps the previous behaviour intact.
          docker buildx imagetools create \
            -t "esst/php:${VARIANT}${SUFFIX}" \
            "esst/php:${VARIANT}${SUFFIX}-amd64" \
            "esst/php:${VARIANT}${SUFFIX}-arm64"
          echo "Published esst/php:${VARIANT}${SUFFIX}"

          # The mobile tag is what production consumes, so a suffixed (test) run
          # must leave it alone. Promote by re-running this workflow with an empty
          # build_suffix once the suffixed image has been validated.
          if [[ "${PUBLISH_MOBILE}" != "true" ]]; then
            echo "Test build: esst/php:${VARIANT} left untouched (promote separately)."
          fi
